services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    # Bound to all interfaces so it's reachable from the local network by IP
    # (no auth is enabled, so keep it off the public internet — set
    # HOST_BIND=127.0.0.1 to restrict to this machine only).
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freellmapi.rule=Host(`freellm.rab.dc.microservice.ma`)"
      - "traefik.http.services.freellmapi.loadbalancer.server.port=3001"

volumes:
  freellmapi-data:

networks:
  proxy-network:
    external: true
